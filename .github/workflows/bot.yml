name: Levithan Voice AI

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: levithan-voice-ai
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: BOT_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "$HF_TOKEN" ]; then
            echo "WARNING: HF_TOKEN is empty"
            echo "Public model access may still work."
          fi

      - name: Build Docker image
        run: docker build --no-cache -t levithan-voice-ai .

      - name: Run Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          docker run --rm \
            -e BOT_TOKEN="$BOT_TOKEN" \
            -e HF_TOKEN="$HF_TOKEN" \
            -e TTS_MODEL_ID="ai4bharat/indic-parler-tts" \
            levithan-voice-ai
