name: Telegram TTS Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-tts-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      PYTHONUNBUFFERED: "1"
      LOCAL_BOT_API: "true"
      LOCAL_BOT_API_URL: "http://127.0.0.1:8081"
      LOCAL_API_CONTAINER: "telegram-bot-api"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg docker.io
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              "python-telegram-bot==21.10" \
              edge-tts \
              gTTS \
              pypdf \
              python-docx \
              EbookLib \
              beautifulsoup4
          fi

      - name: Start Local Telegram Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail

          : "${TELEGRAM_API_ID:?Add TELEGRAM_API_ID in GitHub Secrets}"
          : "${TELEGRAM_API_HASH:?Add TELEGRAM_API_HASH in GitHub Secrets}"
          : "${BOT_TOKEN:?Add BOT_TOKEN in GitHub Secrets}"

          sudo systemctl start docker

          sudo docker run -d \
            --name telegram-bot-api \
            --restart unless-stopped \
            -p 127.0.0.1:8081:8081 \
            -v telegram-bot-api-data:/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest \
            --api-id="${TELEGRAM_API_ID}" \
            --api-hash="${TELEGRAM_API_HASH}" \
            --local

          echo "Waiting for Local Bot API..."
          for i in $(seq 1 30); do
            if sudo docker inspect -f '{{.State.Running}}' telegram-bot-api 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done

          sudo docker ps --filter name=telegram-bot-api
          sudo docker logs --tail 50 telegram-bot-api

      - name: Run Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          LOCAL_BOT_API: "true"
          LOCAL_BOT_API_URL: "http://127.0.0.1:8081"
          LOCAL_API_CONTAINER: "telegram-bot-api"
          SEND_PART_MB: "50"
        run: |
          set -euo pipefail
          python -u bot.py

      - name: Show Local Bot API logs if job fails
        if: failure()
        run: |
          sudo docker logs --tail 100 telegram-bot-api || true

      - name: Stop Local Bot API
        if: always()
        run: |
          sudo docker rm -f telegram-bot-api || true
