
name: Telegram TTS Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-tts-bot-polling
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Docker and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          docker --version

      - name: Start Telegram Local Bot API
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$API_ID" || { echo "Missing API_ID"; exit 1; }
          test -n "$API_HASH" || { echo "Missing API_HASH"; exit 1; }
          test -n "$BOT_TOKEN" || { echo "Missing BOT_TOKEN"; exit 1; }

          mkdir -p "$RUNNER_TEMP/tg-api-data"

          docker pull aiogram/telegram-bot-api:latest
          docker rm -f telegram-bot-api 2>/dev/null || true

          docker run -d \
            --name telegram-bot-api \
            --restart=no \
            -p 127.0.0.1:8081:8081 \
            -e TELEGRAM_API_ID="$API_ID" \
            -e TELEGRAM_API_HASH="$API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            -v "$RUNNER_TEMP/tg-api-data:/var/lib/telegram-bot-api" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v /tmp:/tmp \
            aiogram/telegram-bot-api:latest

          READY=0

          for i in $(seq 1 45); do
            if ! docker inspect -f '{{.State.Running}}' telegram-bot-api 2>/dev/null | grep -q true; then
              echo "Container stopped unexpectedly."
              break
            fi

            if curl -sS --max-time 4 \
              -X POST \
              "http://127.0.0.1:8081/bot${BOT_TOKEN}/getMe" \
              -o "$RUNNER_TEMP/getme.json"; then
              if grep -q '"ok":true' "$RUNNER_TEMP/getme.json"; then
                READY=1
                echo "Local Bot API is ready."
                break
              fi
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Local Bot API readiness check failed."
            docker ps -a --filter name=telegram-bot-api
            docker logs --tail 100 telegram-bot-api || true
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            python-telegram-bot==21.10 \
            edge-tts gTTS pypdf python-docx \
            EbookLib beautifulsoup4

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          LOCAL_BOT_API: "1"
          LOCAL_BOT_API_URL: "http://127.0.0.1:8081"
          MAX_UPLOAD_MB: "1900"
          MAX_INPUT_MB: "1900"
          SEND_PART_MB: "1800"
          MAX_TEXT_CHARS: "20000000"
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Show Local Bot API logs
        if: always()
        run: |
          docker logs --tail 100 telegram-bot-api || true

      - name: Stop Local Bot API and clear server data
        if: always()
        run: |
          docker rm -f telegram-bot-api || true
          sudo rm -rf "$RUNNER_TEMP/tg-api-data"
          rm -f "$RUNNER_TEMP/getme.json"
          sudo rm -rf /tmp/telegram-tts-work
          echo "Cleanup completed"
