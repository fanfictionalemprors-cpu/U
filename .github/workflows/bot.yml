name: Free Telegram TTS Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - ".github/workflows/bot.yml"

permissions:
  contents: read

concurrency:
  group: telegram-tts-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py

      - name: Start Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: GitHub Secret BOT_TOKEN is missing."
            exit 1
          fi

          python -u bot.py
