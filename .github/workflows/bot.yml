name: Run Offline Hindi Audiobook Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: tts-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Create runtime environment
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
            printf 'PART_MINUTES=180\n'
            printf 'CHUNK_CHARS=350\n'
            printf 'TORCH_NUM_THREADS=2\n'
          } > .env

          if [ -z "$BOT_TOKEN" ] || \
             [ -z "$TELEGRAM_API_ID" ] || \
             [ -z "$TELEGRAM_API_HASH" ] || \
             [ -z "$HF_TOKEN" ]; then
            echo "Missing required GitHub Actions secret(s)"
            exit 1
          fi

      - name: Build and start bot + local Telegram API
        run: docker compose up -d --build

      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}"

      - name: Keep alive
        run: |
          end=$((SECONDS + 20700))
          while [ $SECONDS -lt $end ]; do
            sleep 300
            docker compose ps --status running | grep -q bot || docker compose up -d
          done

      - name: Logs and stop
        if: always()
        run: |
          docker compose logs --tail 100 bot || true
          docker compose logs --tail 50 tgapi || true
          docker compose down
