name: Deploy Speech TTS Bot

on:
  push:
    branches:
      - main
    paths:
      - "bot.py"
      - "requirements.txt"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speech-tts-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -e

          for file in \
            bot.py \
            requirements.txt \
            Dockerfile \
            render.yaml
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          echo "All required files found."

      - name: Check Python syntax
        run: |
          python -m py_compile bot.py
          echo "Python syntax check passed."

      - name: Validate deployment secret
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          echo "Render deployment secret is configured."

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -e

          response=$(curl \
            --silent \
            --show-error \
            --fail \
            --retry 3 \
            --retry-delay 5 \
            --max-time 60 \
            --request POST \
            "$RENDER_DEPLOY_HOOK")

          echo "Render deployment request accepted."

          if [ -n "$response" ]; then
            echo "$response"
          fi
