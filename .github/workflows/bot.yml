name: Run Hindi Audiobook Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-audiobook-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          test -n "$BOT_TOKEN" || {
            echo "BOT_TOKEN secret is missing"
            exit 1
          }

          test -n "$TELEGRAM_API_ID" || {
            echo "TELEGRAM_API_ID secret is missing"
            exit 1
          }

          test -n "$TELEGRAM_API_HASH" || {
            echo "TELEGRAM_API_HASH secret is missing"
            exit 1
          }

          echo "Required secrets are configured."

      - name: Create runtime environment
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
            printf 'PART_MINUTES=30\n'
            printf 'MAX_CHARS=450\n'
          } > .env

          chmod 600 .env

      - name: Build and start containers
        run: |
          docker compose up -d --build

      - name: Verify containers
        run: |
          sleep 20
          docker compose ps
          docker compose logs --tail=100 bot

          if ! docker compose ps --status running --services | grep -qx bot; then
            echo "Bot container is not running."
            docker compose logs --no-color bot
            exit 1
          fi

      - name: Keep bot alive
        run: |
          echo "Bot is running."
          echo "The runner will remain active for approximately 5 hours and 35 minutes."
          sleep 20100

      - name: Show logs
        if: always()
        run: |
          docker compose logs --no-color --tail=300 || true

      - name: Stop containers
        if: always()
        run: |
          docker compose down || true
