
name: Telegram TTS Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-tts-bot-polling
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare Local Bot API storage
        run: |
          sudo mkdir -p /var/lib/telegram-bot-api
          sudo chmod 777 /var/lib/telegram-bot-api

      - name: Start Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || {
            echo "Missing API_ID secret"
            exit 1
          }
          test -n "$TELEGRAM_API_HASH" || {
            echo "Missing API_HASH secret"
            exit 1
          }

          docker run -d \
            --name telegram-bot-api \
            -p 127.0.0.1:8081:8081 \
            -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
            -e TELEGRAM_LOCAL=1 \
            --mount type=bind,source=/var/lib/telegram-bot-api,target=/var/lib/telegram-bot-api \
            aiogram/telegram-bot-api:latest

          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' telegram-bot-api 2>/dev/null | grep -q true; then
              docker logs --tail 100 telegram-bot-api || true
              exit 1
            fi
            sleep 2
          done

          docker ps --filter name=telegram-bot-api
          docker logs --tail 50 telegram-bot-api

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            python-telegram-bot==21.10 \
            edge-tts \
            gTTS \
            pypdf \
            python-docx \
            EbookLib \
            beautifulsoup4

      - name: Check syntax
        run: python -m py_compile bot.py

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOCAL_BOT_API: "1"
          LOCAL_BOT_API_URL: "http://127.0.0.1:8081"
          LOCAL_API_CONTAINER: "telegram-bot-api"
          DEFAULT_ENGINE: "edge"
          DEFAULT_RATE: "+10%"
          DEFAULT_PITCH: "+0Hz"
          MAX_INPUT_MB: "1900"
          MAX_UPLOAD_MB: "1900"
          SEND_PART_MB: "1800"
          CHUNK_CHARS: "2500"
          TTS_CONCURRENCY: "3"
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Local Bot API logs
        if: always()
        run: |
          docker logs --tail 100 telegram-bot-api || true
          df -h || true

      - name: Stop Local Bot API
        if: always()
        run: |
          docker stop telegram-bot-api || true
          docker rm telegram-bot-api || true
