name: Run Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # backup: agar chain toot jaye to dobara start

# Ek hi time par ek hi bot chale (do pollers = 409 conflict)
concurrency:
  group: tts-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub job limit 6 ghante
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from secrets
        run: |
          {
            echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}"
            echo "TELEGRAM_API_ID=${{ secrets.TELEGRAM_API_ID }}"
            echo "TELEGRAM_API_HASH=${{ secrets.TELEGRAM_API_HASH }}"
            echo "PART_MINUTES=180"
            echo "CHUNK_CHARS=1000"
            echo "TTS_CONCURRENCY=1"
            echo "TTS_RETRIES=3"
            echo "TTS_TIMEOUT_SECONDS=75"
          } > .env

      - name: Start bot + local Telegram server
        run: docker compose up -d --build

      - name: Queue next run (relay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}"

      - name: Keep alive (~5h 45m)
        run: |
          end=$((SECONDS + 20700))
          while [ $SECONDS -lt $end ]; do
            sleep 300
            docker compose ps --status running | grep -q bot || docker compose up -d
          done

      - name: Stop
        if: always()
        run: |
          docker compose logs --tail 50 bot || true
          docker compose down
