services:
  tgapi:
    image: aiogram/telegram-bot-api:latest
    restart: always

    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"

    volumes:
      - tgdata:/var/lib/telegram-bot-api

    ports:
      - "8081:8081"

  bot:
    build: .
    restart: always

    depends_on:
      - tgapi

    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      LOCAL_API_URL: http://tgapi:8081
      TTS_MODEL_DIR: /app/indus-pocket-tts
      PART_MINUTES: ${PART_MINUTES:-30}
      MAX_CHARS: ${MAX_CHARS:-450}

    volumes:
      - tgdata:/var/lib/telegram-bot-api

volumes:
  tgdata:
