
name: Run TTS Audiobook Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: tts-audiobook-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create environment file
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -eu
          test -n "$BOT_TOKEN"
          test -n "$TELEGRAM_API_ID"
          test -n "$TELEGRAM_API_HASH"

          {
            printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN"
            printf 'TELEGRAM_API_ID=%s\n' "$TELEGRAM_API_ID"
            printf 'TELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_HASH"
            printf 'PART_MINUTES=180\n'
          } > .env

      - name: Start Telegram API and bot
        run: docker compose up -d --build

      - name: Verify services
        run: |
          sleep 15
          docker compose ps
          docker compose logs --tail 50 bot

      - name: Keep bot running
        run: |
          end=$((SECONDS + 20100))

          while [ "$SECONDS" -lt "$end" ]; do
            if ! docker compose ps --status running --services \
              | grep -qx bot; then
              docker compose up -d bot
            fi

            sleep 60
          done

      - name: Show final logs
        if: always()
        run: docker compose logs --tail 100 || true

      - name: Stop services
        if: always()
        run: docker compose down
